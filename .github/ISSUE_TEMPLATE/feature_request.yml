name: Feature request
description: Suggest an improvement for a future version
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Future versions, premium modules, and custom work may be paid.
        The current base version may stay unchanged.
        Do not include secrets or private customer data.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and why it helps users of the editor.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Optional. How you solve this today.
