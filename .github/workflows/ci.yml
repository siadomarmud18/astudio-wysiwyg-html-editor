name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: npm test
      - name: dist matches src
        run: |
          diff -q src/custom-editor.js dist/custom-editor.js
          diff -q src/custom-editor.esm.js dist/custom-editor.esm.js
          diff -q src/custom-editor.css dist/custom-editor.css
          diff -q src/custom-editor-embed.css dist/custom-editor-embed.css
