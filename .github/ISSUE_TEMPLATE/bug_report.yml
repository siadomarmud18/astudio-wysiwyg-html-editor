name: Bug report
description: Report a problem in the Astudio WYSIWYG Rich HTML Editor
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is source-available freeware from Astudio LLC.
        Do not include passwords, private site URLs, or customer data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Value from VERSION or package.json (for example 1.3.1)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 128, Firefox 131, Safari 18
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Optional screenshots or HTML from the Show HTML button in the demo.
