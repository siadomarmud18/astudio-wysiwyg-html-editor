<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astudio WYSIWYG Rich HTML Editor demo</title>
  <link rel="stylesheet" href="../../dist/custom-editor.css">
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #1a202c;
      line-height: 1.5;
    }

    main {
      max-width: 42rem;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.35rem;
    }

    p.lead {
      margin: 0 0 1.25rem;
      color: #4a5568;
    }

    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      border: 0;
      border-radius: 0.35rem;
      background: #2b6cb0;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #2c5282;
    }

    pre {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #fff;
      border: 1px solid #d8dde6;
      border-radius: 0.35rem;
      overflow: auto;
      font-size: 0.85rem;
    }

    code {
      background: #eef2f7;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.9em;
    }
  </style>
</head>

<body>
  <main>
    <h1>Astudio WYSIWYG Rich HTML Editor</h1>
    <p class="lead">
      CKEditor-style API — attach to a <code>&lt;div id="editor"&gt;</code>.
    </p>

    <div id="editor">
      <div class="editor-body">
        <p>Hello from <strong>FreeEditor</strong>!</p>
      </div>
      <div class="editor-footer">
        <span class="fe-wordcount">0 words</span>
        <a href="https://astudio.am/" target="_blank" class="editor-footer-link">Powered by Astudio</a>
      </div>
    </div>

    <button type="button" id="show-html">Show HTML</button>
    <pre id="out">(click the button to preview HTML)</pre>
  </main>

  <script src="../../dist/custom-editor.js"></script>
  <script>
    var devMode = new URLSearchParams(location.search).get("dev") === "1";

    ClassicEditor
      .create({
        attachTo: document.querySelector("#editor"),
        root: {
          placeholder: "Type here...",
        },
        uploadUrl: null,
        requireCsrf: !devMode,
        allowLocalImageFallback: devMode,
      })
      .then(function (editor) {
        document.getElementById("show-html").addEventListener("click", function () {
          document.getElementById("out").textContent = editor.getData();
        });
      })
      .catch(function (err) {
        console.error(err);
        document.getElementById("out").textContent = String(err);
      });
  </script>
</body>

</html>
